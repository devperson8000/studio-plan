<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#111;color:#eee;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.p{position:fixed;background:#1b1d24ee;border:1px solid #333;border-radius:10px;padding:10px;max-height:calc(100vh - 20px);overflow:auto}
#L{left:10px;top:10px;width:170px}#R{right:10px;top:10px;width:210px}
h4{margin:8px 0 6px;font-size:12px;text-transform:uppercase;color:#9aa}h4:first-child{margin-top:0}
button{background:#2b2f3a;color:#eee;border:1px solid #444;border-radius:6px;padding:6px 8px;margin:2px 2px 2px 0;cursor:pointer;font-size:13px}
button:hover{background:#3a4050}#L button{display:block;width:100%;text-align:left}
label{display:block;margin:5px 0;font-size:13px}select{width:100%;background:#2b2f3a;color:#eee;border:1px solid #444;border-radius:6px;padding:5px}input[type=range]{width:100%}input[type=color]{width:100%;height:28px;border:0;padding:0}
#hud{position:fixed;inset:0;pointer-events:none;display:none}#hud>*{pointer-events:auto}#hud .t{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:8px;pointer-events:none;text-align:center}#hud .x{position:absolute;right:12px;top:12px}#pad{position:absolute;left:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,52px);gap:4px}#pad button{height:52px;margin:0;font-size:20px;touch-action:none}#msg{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:8px}
@media(max-width:700px){#L{width:120px}#R{width:150px}}
</style></head><body>
<canvas id="c"></canvas><div id="msg">Loading studio…</div>
<div id="hud"><div class="t">WASD / arrows: walk · drag: look · Shift: run · E: open/close door · Esc: exit</div><button class="x" id="exitw">✕ Exit walk mode</button><div id="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div></div>
<div class="p" id="L"><h4>Quick start</h4><button id="walk">🚶 Walk around</button><button id="setup">★ Gaming setup</button><h4>Add item</h4></div>
<div class="p" id="R">
<h4>View</h4><button data-v="top">Top</button><button data-v="deck">Deck</button><button data-v="in">Inside</button>
<button id="roofb" style="width:100%;font-weight:600;padding:9px">🏠 Roof: OFF</button><input type="checkbox" id="roof" hidden>
<h4>Room lighting</h4>
<label>Day ↔ Night<input type="range" id="night" min="0" max="1" step="0.01" value="0.2"></label>
<label>Interior wall colour<input type="color" id="wallc" value="#ccced6"></label><label>Exterior colour<input type="color" id="cladc" value="#a1adc2"></label><label>Global RGB colour<input type="color" id="acc" value="#8a2be2"></label>
<label>RGB mode<select id="mode"><option value="s">Static</option><option value="r">Rainbow cycle</option></select></label>
<label><input type="checkbox" id="hq" checked> High-quality glow (bloom)</label><label>Fan speed<input type="range" id="fs" min="0" max="2" step="0.05" value="1"></label>
<h4>Selected item</h4>
<label>Body colour<input type="color" id="ic" value="#222222"></label>
<label>This item's RGB<input type="color" id="ia" value="#8a2be2"></label><button id="ar">Use global RGB</button>
<label>Width<input type="range" id="sw" min="0.3" max="4" step="0.05" value="1"></label>
<label>Height<input type="range" id="sh" min="0.3" max="4" step="0.05" value="1"></label>
<label>Depth<input type="range" id="sd" min="0.3" max="4" step="0.05" value="1"></label>
<label>Real size in cm (W · H · D)<input type="number" id="nw" style="width:32%"> <input type="number" id="nh" style="width:32%"> <input type="number" id="nd" style="width:32%"></label><label>Lift off floor<input type="range" id="se" min="0" max="2" step="0.01" value="0"></label>
<button id="r15">⟳ 15°</button><button id="r90">⟳ 90°</button><button id="dup">Copy</button><button id="del">Delete</button>
<p style="color:#9aa;font-size:12px;margin:6px 0">Drag to move. R = rotate, Del = remove. Lift a monitor to 0.77 to sit it on a desk.</p>
<h4>Save &amp; load</h4><button id="exp">⬇ Save to file</button><button id="imp">⬆ Load from file</button><input type="file" id="file" accept=".json,application/json" hidden><br><button id="save">Quick save</button><button id="load">Quick load</button><button id="clr">Clear all</button>
</div>

  if(inR(x,z,.95,1.35,-2.95,-1.45)||inR(x,z,.95,1.35,-.95,-.18)||inR(x,z,2.05,2.45,-2.95,-1.4)||inR(x,z,2.05,2.45,-.9,-.18)||inR(x,z,0,1.35,-2.95,-2.55)||inR(x,z,2.05,3.4,-2.95,-2.55))return false;

function stepWalk(dt){const f=(keys.w?1:0)-(keys.s?1:0),r=(keys.d?1:0)-(keys.a?1:0),v=dt*(keys.shift?3.2:1.5);
